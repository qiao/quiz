<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<!--{{LICENSE}}-->
<script>
  // Sets a saved theme before the first paint, so the page does not flash the other theme.
  try {
    const savedTheme = localStorage.getItem('quiz:theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      document.documentElement.dataset.theme = savedTheme;
    }
  } catch {}
</script>
<style>
/*{{FONTS_CSS}}*/
/*{{TOKENS_CSS}}*/

*,
*::before,
*::after {
  box-sizing: border-box;
}

/*
 * The cursor is an arrow on every surface, as in a slide deck, so it does not change to a text

 */
html,
body {
  margin: 0;
  background: var(--vbg-background-100);
  color: var(--vbg-gray-1000);
  font-family: var(--vbg-font-sans);
  font-size: var(--vbg-type-body);

  cursor: default;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;

}

a {
  color: inherit;
  text-decoration-color: color-mix(in oklab, currentColor 35%, transparent);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

a:hover {
  text-decoration-color: currentColor;
}

:focus-visible {
  outline: 2px solid var(--vbg-focus);
  outline-offset: 2px;
}

code,
pre {
  font-family: var(--vbg-font-mono);
  font-size: 0.875em;
  tab-size: 2;
}

/* Inline code sits on a soft fill with no border, so a line with several names stays calm. */
:not(pre) > code {
  padding: 0.1em 0.3em;
  border-radius: var(--vbg-radius-small);
  background: var(--vbg-gray-alpha-400);
  font-size: 0.85em;
}

pre {
  margin: var(--vbg-space-3) 0;
  padding: var(--vbg-space-3) var(--vbg-space-4);
  overflow-x: auto;
  border-radius: var(--vbg-radius);
  background: var(--vbg-background-200);
  box-shadow: inset 0 0 0 1px var(--vbg-gray-alpha-400);
  line-height: 1.6;
  text-align: left;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

.bar {
  display: flex;
  gap: var(--vbg-space-4);
  align-items: center;
  min-height: 56px;
  padding: 0 var(--vbg-space-4) 0 var(--vbg-space-6);
  font-size: var(--vbg-type-compact);
}

.bar-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  color: var(--vbg-gray-900);
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bar-count {

  font-variant-numeric: tabular-nums;

/* The progress line: a hairline across the page, and a fill of 2 px that grows from the left. */
.progress {

}

.progress-fill {
  width: 0;

.slide {
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: center;
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: var(--vbg-space-10) var(--vbg-space-6) var(--vbg-space-12);
}

/*
 * A question slide starts at a fixed distance from the top, so the prompt and choices stay in place
 * after an answer. The distance puts a block of about 600 px in the middle of the window, so every
 * question starts at the same height, and a tall window gets more space above the question.
 */
.slide-question {
  justify-content: flex-start;
  padding-top: max(var(--vbg-space-10), calc(50vh - 300px));
}

.slide:focus,
.feedback:focus {

.meta {

.lede {

.prompt code {

.rich > :first-child {

.rich > :last-child {

.choices {

.choice {

.choice:hover:not([aria-disabled='true']) {

/* The first line of the text is 24 px tall, so it lines up with the key cap. */

.choice-status {

.icon {

.choice-rationale {

/*

.citation {

.actions {

.button-primary {

.button-primary:hover {

.button-secondary {

.button-secondary:hover {

.button-tertiary {

.button-tertiary:hover {

.tiers {

  margin: var(--vbg-space-10) 0 0;

.tier {

.tier .tier-label {

.tier-count {

/* A key cap: a small filled cap with the key name in the sans font. */

/* A key hint at the end of a button. The hint takes the text color of the button. */
.button-key {

  color: inherit;
}

/* A device with no keyboard and no hover, for example a phone, does not show the key hint. */
@media (hover: none) and (pointer: coarse) {
  .button-key {
    display: none;
  }
}

/* A finger needs a target of 44 pixels. */
@media (pointer: coarse) {
  .button {
    min-height: 44px;
  }

  .theme-toggle {

  }
}

/* The tier rows: the tier label, a bar in the band color of the tier, and the count. */
.score-table {
  width: 100%;
  margin-top: var(--vbg-space-10);
  border-collapse: collapse;
  font-size: var(--vbg-type-compact);
  font-variant-numeric: tabular-nums;
}

.score-table th,
.score-table td {
  padding: var(--vbg-space-3) 0;
  box-shadow: inset 0 -1px 0 var(--vbg-gray-alpha-400);
  text-align: left;
}

.score-table tr:first-child > * {
  box-shadow:
    inset 0 1px 0 var(--vbg-gray-alpha-400),
    inset 0 -1px 0 var(--vbg-gray-alpha-400);
}

/* The label column takes only the width of the longest tier name. */
.score-table th {
  width: 1%;
  padding-right: var(--vbg-space-8);
  font-weight: 500;
  white-space: nowrap;
}

.score-cell {
  display: flex;
  gap: var(--vbg-space-6);
  align-items: center;
}

.score-bar {
  flex: 1;
  height: 6px;
  overflow: hidden;
  border-radius: var(--vbg-radius-small);
  background: var(--vbg-gray-400);
}

.score-bar-fill {
  display: block;
  height: 100%;
  background: var(--band-color);
}

.score-cell-count {
  min-width: 4.5em;
  color: var(--vbg-gray-900);
  text-align: right;
  white-space: nowrap;
}

/* The score hero: the ring on the left and the summary on the right. */
.score-hero {
  display: flex;
  gap: var(--vbg-space-8);
  align-items: center;
}

.score-summary {
  min-width: 0;
}

.score-title {
  margin: 0;
  font-size: var(--vbg-type-section);
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.25;
  text-wrap: balance;
}

.score-summary .lede {
  margin-top: var(--vbg-space-2);
}

/* The score ring holds the count in its center. The heading label carries the full text. */
.score {
  display: grid;
  flex: none;
  width: 144px;
  height: 144px;
  margin: 0;
  place-items: center;
}

.score > *,
.ring svg {
  display: block;
  grid-area: 1 / 1;
  width: 144px;
  height: 144px;
}

.ring circle {
  fill: none;
  stroke-width: 3;
}

.ring-track {
  stroke: var(--vbg-gray-400);
}

/* A score band sets one color for its marks: 70% or more is green, 40% or more is amber, and
   less is red. The count and the summary line give the same result without color. */
.band-high {
  --band-color: var(--vbg-green-900);
}

.band-middle {
  --band-color: var(--vbg-amber-900);
}

.band-low {
  --band-color: var(--vbg-red-900);
}

/* The fill starts at 12 o'clock through the rotate attribute in the markup, which needs no
   origin box, so every SVG engine turns it the same way. */
.ring-fill {
  stroke: var(--band-color, var(--vbg-gray-1000));
  stroke-dasharray: 100;
  stroke-linecap: round;
}

.ring.is-empty .ring-fill {
  display: none;
}

.score-text {
  display: grid;
  height: auto;
  justify-items: center;
}

.score-count {
  font-size: var(--vbg-type-title);
  font-weight: 600;
  letter-spacing: -0.04em;
  line-height: 1;
}

.score-total {
  color: var(--vbg-gray-900);
  font-size: var(--vbg-type-subsection);
  font-weight: 500;
}

.score-percent {
  margin-top: 6px;
  color: var(--band-color, var(--vbg-gray-900));
  font-family: var(--vbg-font-mono);
  font-size: var(--vbg-type-label);
  font-weight: 500;
  letter-spacing: 0;
}

/*
 * Motion. Every animation sits inside this media query, so the page is complete with no motion.
 * Slide enter: the enter half of the transitions.dev recipe 08-page-side-by-side.md.
 * The old slide does not slide out, because the page renders one slide at a time.
 */
@media (prefers-reduced-motion: no-preference) {
  /* The fill of the ring and of each tier bar moves with the count-up, which takes 800 ms. */
  .ring-fill {
    transition: stroke-dashoffset 800ms linear;
  }

  .score-bar-fill {
    transition: width 800ms linear;
  }

  .progress-fill {
    transition: width var(--duration-fast) var(--ease-smooth-out);
  }

  .choice,
  .choice-letter,
  .button {
    transition:
      background-color var(--duration-quick) ease,
      box-shadow var(--duration-quick) ease,
      color var(--duration-quick) ease;
  }

  .slide[data-enter='next'] {
    --enter-x: var(--distance-base);
  }

  .slide[data-enter='back'] {
    --enter-x: calc(var(--distance-base) * -1);
  }

  .slide.is-entering {
    animation: slide-enter var(--duration-fast) var(--ease-smooth-out) both;
  }

  /*
   * Answer: the status icons draw their stroke, as in the recipe 25-checkbox-check.md, and the
   * feedback rises in, as one line of the recipe 18-texts-reveal.md.
   */
  .slide.is-answering .choice-status .icon path,
  .slide.is-answering .result .icon path {
    stroke-dasharray: var(--icon-length);
    animation: icon-draw var(--duration-medium) var(--ease-smooth-out) both;
  }

  /*
   * Answer: the notes under the choices open from zero height, as a smooth accordion, and rise in
   * with the texts reveal of the feedback. All notes move together, because the design rules
   * forbid staggered entry. The rows below move down with them.
   */
  .slide.is-answering .choice-notes {
    animation: notes-open var(--duration-medium) var(--ease-smooth-out) both;
  }

  .slide.is-answering .choice-notes-inner {
    overflow: hidden;
    animation: notes-rise var(--duration-medium) var(--ease-smooth-out) both;
  }

  .slide.is-answering .feedback,
  .is-rising {
    animation: feedback-rise var(--duration-very-slow) var(--ease-smooth-out) both;
  }

  /* The warm line under the score waits for the count-up to end. */
  .is-rising {
    animation-delay: 800ms;
  }

  /* Confetti for a perfect score: flat pieces in the page colors that fall and turn once. */
  .confetti {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .confetti-piece {
    position: absolute;
    top: -16px;
    left: var(--x);
    width: 8px;
    height: 14px;
    background: var(--vbg-gray-1000);
    animation: confetti-fall var(--fall) ease-in var(--delay) both;
  }

  .confetti-piece.tone-1 {
    background: var(--vbg-green-900);
  }

  .confetti-piece.tone-2 {
    background: var(--vbg-gray-900);
  }

  @keyframes confetti-fall {
    from {
      opacity: 1;
      transform: translateY(0) rotate(0deg);
    }

    to {
      opacity: 0;
      transform: translateY(100vh) rotate(var(--spin));
    }
  }

  @keyframes icon-draw {
    from {
      stroke-dashoffset: var(--icon-length);
    }

    to {
      stroke-dashoffset: 0;
    }
  }

  @keyframes notes-open {
    from {
      grid-template-rows: 0fr;
    }

    to {
      grid-template-rows: 1fr;
    }
  }

  @keyframes notes-rise {
    from {
      opacity: 0;
      transform: translateY(var(--distance-base));
      filter: blur(var(--blur-medium));
    }

    to {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  @keyframes feedback-rise {
    from {
      opacity: 0;
      transform: translateY(var(--distance-medium));
      filter: blur(var(--blur-medium));
    }

    to {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  @keyframes slide-enter {
    from {
      opacity: 0;
      transform: translateX(var(--enter-x, 0px));
      filter: blur(var(--blur-medium));
    }

    to {
      opacity: 1;
      transform: translateX(0);
      filter: blur(0);
    }
  }
}

@media (max-width: 600px) {
  h1 {
    font-size: var(--vbg-type-title);
  }

  .prompt {
    font-size: var(--vbg-type-subsection);
  }

  .bar {
    min-height: 48px;
    padding: 0 var(--vbg-space-2) 0 var(--vbg-space-4);
  }

  /* A narrow bar shows only the count, if any, and the theme button. The tab keeps the title. */
  .bar-title {
    display: none;
  }

  .bar-count {
    flex: 1;
  }

  .slide {
    justify-content: flex-start;
    padding: var(--vbg-space-6) var(--vbg-space-4) var(--vbg-space-10);
  }

  .feedback {
    padding: var(--vbg-space-4);
  }

  /* A narrow screen puts each tier on one row, with the count at the end of the row. */
  .tiers {
    grid-template-columns: 1fr;
    grid-auto-flow: row;
    gap: 0;
  }

  .tier {
    display: flex;
    justify-content: space-between;
    padding: var(--vbg-space-3) 0;
  }

  .tier:last-child {
    box-shadow:
      inset 0 1px 0 var(--vbg-gray-alpha-400),
      inset 0 -1px 0 var(--vbg-gray-alpha-400);
  }

  .tier-count {
    margin-top: 0;
  }

  .score-hero {
    flex-direction: column;
    gap: var(--vbg-space-6);
    align-items: flex-start;
  }

  .score-table th {
    padding-right: var(--vbg-space-4);
  }

  .score-cell {
    gap: var(--vbg-space-4);
  }

  /* The buttons share the row equally. A grid ignores the padding that a flex basis counts. */
  .actions {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
  }

  .actions-end {
    display: grid;
    margin-left: 0;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="bar-title" id="bar-title"></span>
    <span class="bar-count" id="bar-count"></span>
    <button type="button" class="button button-tertiary theme-toggle" id="theme-toggle"></button>
  </header>
  <div class="progress" aria-hidden="true">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <main class="slide" id="slide" tabindex="-1"></main>
  <div class="visually-hidden" id="announcer" aria-live="polite" aria-atomic="true"></div>
</div>
<noscript>
  <p class="slide">This quiz needs JavaScript. Turn on JavaScript and open the page again.</p>
</noscript>
<script id="quiz-data" type="application/json">{{QUIZ_DATA}}</script>
<script>
(() => {
  'use strict';

  const LETTERS = ['a', 'b', 'c', 'd'];
  const KEY_LETTERS = { 1: 'a', 2: 'b', 3: 'c', 4: 'd', a: 'a', b: 'b', c: 'c', d: 'd' };
  const THEME_KEY = 'quiz:theme';

  const slideElement = document.getElementById('slide');
  const announcer = document.getElementById('announcer');
  const themeToggle = document.getElementById('theme-toggle');

  /** Reads, writes, and removes browser storage, and ignores storage that the browser blocks. */
  const storage = {
    get(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch {}
    },
    remove(key) {
      try {
        localStorage.removeItem(key);
      } catch {}
    },
  };

  /**
   * Makes an element with attributes and children.
   *
   * @param {string} tag Tag name.
   * @param {Record<string, string>} [attributes] Attributes. The `html` key sets safe HTML from the
   *   build, and the `text` key sets plain text.
   * @param {Array<Node | string | null>} [children] Child nodes or text.
   * @returns {HTMLElement} The element.
   */
  function element(tag, attributes = {}, children = []) {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes)) {
      if (name === 'html') node.innerHTML = value;
      else if (name === 'text') node.textContent = value;
      else node.setAttribute(name, value);
    }
    for (const child of children) {
      if (child !== null) node.append(child);
    }
    return node;
  }

  // Each icon path. A status icon also has its length in user units, rounded up, for the stroke
  // draw animation.
  const ICONS = {
    check: { path: 'M3.5 8.5l3 3 6-7', length: 14 },
    cross: { path: 'M4 4l8 8M12 4l-8 8', length: 23 },
    sun: {
      path:
        'M8 5.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5M8 1.5v1.25M8 13.25v1.25M1.5 8h1.25' +
        'M13.25 8h1.25M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9',
    },
    moon: { path: 'M13.5 10A5.5 5.5 0 0 1 6 2.5a5.5 5.5 0 1 0 7.5 7.5z' },
    external: { path: 'M5.5 4h6.5v6.5M12 4l-8 8' },
    back: { path: 'M12.5 8h-9M7 4.5L3.5 8 7 11.5' },
    next: { path: 'M3.5 8h9M9 4.5l3.5 3.5L9 11.5' },
  };

  /**
   * Makes a small line icon. A word or an accessible name always goes with it, so the icon is
   * hidden from readers.
   *
   * @param {keyof typeof ICONS} name Icon name.
   * @returns {SVGSVGElement} The icon.
   */
  function icon(name) {
    const svgNamespace = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNamespace, 'svg');
    svg.setAttribute('class', 'icon');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('aria-hidden', 'true');
    const { length } = ICONS[name];
    if (length) svg.setAttribute('style', `--icon-length: ${length}`);
    const path = document.createElementNS(svgNamespace, 'path');
    path.setAttribute('d', ICONS[name].path);
    svg.append(path);
    return svg;
  }

  /**
   * Makes a button.
   *
   * @param {string} label Button text.
   * @param {'primary' | 'secondary' | 'tertiary'} variant Button style.
   * @param {() => void} onClick Action.
   * @param {{ before?: keyof typeof ICONS, after?: keyof typeof ICONS }} [icons] Icons before
   *   and after the label.
   * @returns {HTMLButtonElement} The button.
   */
  function button(label, variant, onClick, icons = {}) {
    const node = element('button', { type: 'button', class: `button button-${variant}` }, [
      icons.before ? icon(icons.before) : null,
      label,
      icons.after ? icon(icons.after) : null,
    ]);
    node.addEventListener('click', onClick);
    return /** @type {HTMLButtonElement} */ (node);
  }

  /**
   * Makes a tier label: the level mark and the tier name. The level mark has three bars of rising
   * height, and one bar is on for each tier step. The name goes with the mark, so the mark is
   * hidden from readers, and a hidden prefix gives the tier number.
   *
   * @param {number} tier Tier from 1 to 3.
   * @param {string} name Tier name.
   * @returns {HTMLElement} The label.
   */
  function tierLabel(tier, name) {
    const bars = [1, 2, 3].map((step) => element('i', step <= tier ? { class: 'is-on' } : {}));
    return element('span', { class: 'tier-label' }, [
      element('span', { class: 'level', 'aria-hidden': 'true' }, bars),
      element('span', { class: 'visually-hidden', text: `Tier ${tier}: ` }),
      name,
    ]);
  }

  /**
   * Replaces the slide content, and skips children that a render function left out.
   *
   * @param {Array<Node | string | null>} children Slide content in order.
   */
  function showSlide(children) {
    slideElement.replaceChildren(...children.filter((child) => child !== null));
  }

  let quiz;
  try {
    quiz = JSON.parse(document.getElementById('quiz-data').textContent);
  } catch {
    const text = 'The quiz data is not valid. Build the page again.';
    slideElement.append(element('p', { text }));
    return;
  }

  const questionCount = quiz.questions.length;
  const endSlide = questionCount + 1;
  const stateKey = `quiz:${quiz.id}:state`;

  /**
   * Reads the saved progress, and drops any value that does not fit this quiz.
   *
   * @returns {{ answers: Record<number, string>, currentSlide: number }} The progress.
   */
  function loadState() {
    const answers = {};
    let currentSlide = 0;
    try {
      const saved = JSON.parse(storage.get(stateKey) || 'null');
      if (saved && typeof saved.answers === 'object' && saved.answers) {
        for (const [key, letter] of Object.entries(saved.answers)) {
          const id = Number(key);
          if (Number.isInteger(id) && id >= 1 && id <= questionCount && LETTERS.includes(letter)) {
            answers[id] = letter;
          }
        }
      }
      if (saved && Number.isInteger(saved.currentSlide)) currentSlide = saved.currentSlide;
    } catch {}
    return { answers, currentSlide };
  }

  let state = loadState();

  function saveState() {
    storage.set(stateKey, JSON.stringify(state));
  }

  /**
   * Finds the correct choice of a question.
   *
   * @param {any} question Built question.
   * @returns {any} The correct choice.
   */
  function correctChoice(question) {
    return question.choices.find((choice) => choice.kind === 'correct');
  }

  function isAnsweredCorrectly(question) {
    return state.answers[question.id] === correctChoice(question).id;
  }

  /**
   * Gives the last slide that the learner can open. A question after an open question is locked.
   *
   * @returns {number} The first question with no answer, or the end slide.
   */
  function lastOpenSlide() {
    const open = quiz.questions.find((question) => !state.answers[question.id]);
    return open ? open.id : endSlide;
  }

  /**
   * Opens a slide and updates the saved progress and the URL hash.
   *
   * @param {number} slide Slide index: 0 for the title, 1 to N for questions, N + 1 for the end.
   * @param {{ replace?: boolean, focus?: boolean }} [options] Hash and focus options.
   */
  function goTo(slide, options = {}) {
    const target = Math.max(0, Math.min(slide, lastOpenSlide()));
    const direction = target > state.currentSlide ? 'next' : 'back';
    const moved = target !== state.currentSlide;
    state.currentSlide = target;
    saveState();
    const hash = `#${target}`;
    if (location.hash !== hash) {
      if (options.replace) history.replaceState(null, '', hash);
      else history.pushState(null, '', hash);
    }
    slideElement.classList.remove('is-answering');
    clearSlideTimers();
    render(options.focus !== false);
    if (moved && options.focus !== false) enterSlide(direction);
  }

  /**
   * Plays the enter transition of a new slide. The slide comes in from the side of travel. The
   * CSS plays the animation only when the system does not ask for reduced motion.
   *
   * @param {'next' | 'back'} direction Side of travel.
   */
  function enterSlide(direction) {
    slideElement.classList.remove('is-entering');
    slideElement.dataset.enter = direction;
    void slideElement.offsetWidth; // Forces a reflow, so the animation starts again.
    slideElement.classList.add('is-entering');
  }

  slideElement.addEventListener('animationend', (event) => {
    if (event.target === slideElement) slideElement.classList.remove('is-entering');
    if (event.animationName === 'feedback-rise') slideElement.classList.remove('is-answering');
  });

  // True when the learner reaches the end slide from the last question. A reload or a hash jump
  // to the end slide does not set it, so the score plays its reveal only for a real finish.
  let finishedNow = false;

  function next() {
    const slide = state.currentSlide;
    if (slide === 0) goTo(lastOpenSlide());
    else if (slide <= questionCount && state.answers[slide]) {
      finishedNow = slide === questionCount;
      goTo(slide + 1);
    }
  }

  function back() {
    if (state.currentSlide > 0) goTo(state.currentSlide - 1);
  }

  function restart() {
    state = { answers: {}, currentSlide: 0 };
    storage.remove(stateKey);
    goTo(0);
  }

  function retryMissed() {
    const missed = quiz.questions.filter((question) => !isAnsweredCorrectly(question));
    for (const question of missed) delete state.answers[question.id];
    if (missed.length) goTo(missed[0].id);
  }

  /**
   * Records the answer of the learner for the current question.
   *
   * @param {string} letter Choice letter.
   */
  function choose(letter) {
    const question = quiz.questions[state.currentSlide - 1];
    if (!question || state.answers[question.id]) return;
    state.answers[question.id] = letter;
    saveState();
    slideElement.classList.add('is-answering');
    render(false);

    const correct = correctChoice(question);
    const explanation = element('div', { html: question.explanationHtml }).textContent;
    announcer.textContent =
      letter === correct.id
        ? `Correct. ${explanation}`
        : `Not correct. The correct choice is ${correct.id.toUpperCase()}. ${explanation}`;
    // The focus moves to the feedback and not to a button, so Enter still goes on. The view does
    // not scroll, so the choice that the learner picked stays where it was.
    document.getElementById('feedback')?.focus({ preventScroll: true });
  }

  /**
   * Gives the text that names a citation, for example `src/cache.ts:15-32`.
   *
   * @param {any} citation Built citation.
   * @returns {string} The label.
   */
  function citationLabel(citation) {
    if (citation.page) return `${citation.target}, page ${citation.page}`;
    if (citation.lineStart) {
      const end = citation.lineEnd && citation.lineEnd !== citation.lineStart;
      return `${citation.target}:${citation.lineStart}${end ? `-${citation.lineEnd}` : ''}`;
    }
    return citation.target;
  }

  function renderTitleSlide() {
    const tiers = [1, 2, 3]
      .map((tier) => quiz.questions.filter((question) => question.tier === tier))
      .filter((questions) => questions.length > 0);
    const answeredCount = Object.keys(state.answers).length;
    const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;

    const tierStrip = element(
      'ol',
      { class: 'tiers', 'aria-label': 'Tiers' },
      tiers.map((questions) =>
        element('li', { class: 'tier' }, [
          tierLabel(questions[0].tier, questions[0].tierName),
          element('span', { class: 'tier-count', text: plural(questions.length, 'question') }),
        ]),
      ),
    );

    // The start button ends with the key that starts the quiz. The hint is hidden from readers,
    // so the name of the button stays its label.
    const startLabel = answeredCount ? 'Continue the quiz' : 'Start the quiz';
    const startButton = button(startLabel, 'primary', next);
    const keyHint = { class: 'button-key', 'aria-hidden': 'true', text: 'Enter' };
    startButton.append(element('kbd', keyHint));
    const actions = element('div', { class: 'actions' }, [
      startButton,
      answeredCount ? button('Restart', 'secondary', restart) : null,
    ]);

    // The cover lists no keys. The key caps on the choices, the hint in the start button, and the
    // tooltip of the theme button show the keys where the learner uses them. The tier strip gives
    // the tiers, so the lede gives only the question count and the source.
    const lede = `${plural(questionCount, 'question')} · ${quiz.source}`;
    showSlide([
      element('h1', { text: quiz.title }),
      element('p', { class: 'lede', text: lede }),
      tierStrip,
      actions,
    ]);
  }

  function renderQuestionSlide(question) {
    const answer = state.answers[question.id];
    const correct = correctChoice(question);

    const choices = element(
      'ol',
      { class: 'choices' },
      question.choices.map((choice, index) => {
        let status = null;
        let stateClass = '';
        if (answer) {
          if (choice.id === correct.id) {
            stateClass = 'is-correct';
            const mine = answer === choice.id;
            status = [icon('check'), mine ? 'Your answer (correct)' : 'Correct answer'];
          } else if (choice.id === answer) {
            stateClass = 'is-wrong';
            status = [icon('cross'), 'Your answer (not correct)'];
          } else {
            stateClass = 'is-other';
          }
        }
        const notes = [
          status ? element('span', { class: 'choice-status' }, status) : null,
          answer && choice.rationaleHtml
            ? element('span', { class: 'choice-rationale rich', html: choice.rationaleHtml })
            : null,
        ].filter((note) => note !== null);
        const body = element('span', { class: 'choice-body' }, [
          element('span', { class: 'rich', html: choice.textHtml }),
          notes.length
            ? element('span', { class: 'choice-notes' }, [
                element('span', { class: 'choice-notes-inner' }, notes),
              ])
            : null,
        ]);
        const node = element(
          'button',
          {
            type: 'button',
            class: `choice ${stateClass}`.trim(),
            'aria-disabled': answer ? 'true' : 'false',
            'aria-keyshortcuts': `${index + 1} ${choice.id.toUpperCase()}`,
          },
          [element('span', { class: 'choice-letter', text: choice.id }), body],
        );
        node.addEventListener('click', () => choose(choice.id));
        return element('li', {}, [node]);
      }),
    );

    let feedback = null;
    if (answer) {
      const citation = question.citation;
      const linkAttributes = {
        href: citation.url,
        target: '_blank',
        rel: 'noopener noreferrer',
        text: citationLabel(citation),
      };
      const source = citation.url
        ? element('a', linkAttributes, [icon('external')])
        : element('code', { text: citationLabel(citation) });
      const isRight = answer === correct.id;
      const resultText = isRight
        ? 'Correct.'
        : `Not correct. The correct choice is ${correct.id.toUpperCase()}.`;
      const feedbackAttributes = {
        class: `feedback ${isRight ? 'is-correct' : 'is-wrong'}`,
        id: 'feedback',
        tabindex: '-1',
        'aria-label': 'Explanation',
      };
      feedback = element('section', feedbackAttributes, [
        element('p', { class: 'result' }, [icon(isRight ? 'check' : 'cross'), resultText]),
        element('div', { class: 'rich', html: question.explanationHtml }),
        element('p', { class: 'citation' }, ['Source: ', source]),
      ]);
    }

    const isLast = question.id === questionCount;
    // A learner who reviews a question from the score slide can go back to it in one step.
    const reviewing = !isLast && lastOpenSlide() === endSlide;
    const nextLabel = isLast ? 'See the score' : 'Next';
    const nextButton = button(nextLabel, 'primary', next, { after: 'next' });
    nextButton.disabled = !answer;
    if (!answer) nextButton.title = 'Choose an answer first';

    showSlide([
      element('div', { class: 'meta' }, [
        tierLabel(question.tier, question.tierName),
        element('span', { text: `Question ${question.id} of ${questionCount}` }),
      ]),
      element('div', { class: 'prompt rich', html: question.promptHtml }),
      choices,
      feedback,
      element('div', { class: 'actions' }, [
        button('Back', 'secondary', back, { before: 'back' }),
        reviewing ? button('See the score', 'tertiary', () => goTo(endSlide)) : null,
        element('span', { class: 'actions-end' }, [nextButton]),
      ]),
    ]);
  }

  /**
   * Names the band of a score. The band sets the color of the score marks and the summary line.
   *
   * @param {number} percent Score from 0 to 100.
   * @returns {'high' | 'middle' | 'low'} The band.
   */
  function scoreBand(percent) {
    if (percent >= 70) return 'high';
    if (percent >= 40) return 'middle';
    return 'low';
  }

  /**
   * Gives one warm line for the score band.
   *
   * @param {number} percent Score from 0 to 100.
   * @returns {string} The line.
   */
  function scoreLine(percent) {
    if (percent === 100) return 'Every answer is correct.';
    const lines = {
      high: 'A good result. Read the missed questions to learn more.',
      middle: 'Good progress. Read the explanation of each missed question.',
      low: 'A first try. Read the explanation of each question.',
    };
    return lines[scoreBand(percent)];
  }

  /**
   * Counts a number up from 0 to its value in 20 steps over 800 ms.
   *
   * @param {HTMLElement} node Element that shows the number.
   * @param {number} value Final value.
   */
  function countUp(node, value) {
    let step = 0;
    const timer = setInterval(() => {
      step += 1;
      node.textContent = String(Math.round((value * step) / 20));
      if (step >= 20) clearInterval(timer);
    }, 40);
    slideTimers.push(timer);
  }

  // Timers of the current slide. A new slide clears them, so a fast Restart or Back does not
  // drop confetti or count on a slide that is gone.
  /** @type {number[]} */
  let slideTimers = [];

  function clearSlideTimers() {
    for (const timer of slideTimers) {
      clearInterval(timer);
      clearTimeout(timer);
    }
    slideTimers = [];
  }

  /** Drops 60 small pieces from the top edge for a perfect score, and removes them after 2.4 s. */
  function dropConfetti() {
    const layer = element('div', { class: 'confetti', 'aria-hidden': 'true' });
    for (let index = 0; index < 60; index += 1) {
      const style =
        `--x: ${Math.random() * 100}%; --delay: ${Math.round(Math.random() * 400)}ms; ` +
        `--fall: ${Math.round(1200 + Math.random() * 800)}ms; ` +
        `--spin: ${Math.round(Math.random() * 720 - 360)}deg`;
      layer.append(element('i', { class: `confetti-piece tone-${index % 3}`, style }));
    }
    document.body.append(layer);
    setTimeout(() => layer.remove(), 2400);
  }

  function renderEndSlide() {
    const correctCount = quiz.questions.filter(isAnsweredCorrectly).length;
    const percent = Math.round((correctCount / questionCount) * 100);
    const missed = quiz.questions.filter((question) => !isAnsweredCorrectly(question));
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const live = finishedNow && !reducedMotion;
    finishedNow = false;

    const countNode = element('span', { text: live ? '0' : String(correctCount) });
    const percentNode = element('span', { text: live ? '0' : String(percent) });
    const label = `${correctCount} of ${questionCount} correct (${percent}%)`;
    // The fill circle has a path length of 100, so the fill is a dash of 100 and the offset
    // hides the percent that the score did not earn.
    const fillOffset = 100 - (correctCount / questionCount) * 100;
    const ring = element('span', {
      class: correctCount ? 'ring' : 'ring is-empty',
      html:
        '<svg viewBox="0 0 144 144" aria-hidden="true">' +
        '<circle class="ring-track" cx="72" cy="72" r="66"></circle>' +
        `<circle class="ring-fill" cx="72" cy="72" r="66" pathLength="100" ` +
        `transform="rotate(-90 72 72)" ` +
        `style="stroke-dashoffset: ${live ? 100 : fillOffset}"></circle></svg>`,
    });
    const headingClass = `score band-${scoreBand(percent)}`;
    const heading = element('h1', { class: headingClass, 'aria-label': label }, [
      ring,
      element('span', { class: 'score-text' }, [
        element('span', { class: 'score-count' }, [
          countNode,
          element('span', { class: 'score-total', text: `/${questionCount}` }),
        ]),
        element('span', { class: 'score-percent' }, [percentNode, '%']),
      ]),
    ]);
    if (live) {
      countUp(countNode, correctCount);
      countUp(percentNode, percent);
      if (percent === 100) slideTimers.push(setTimeout(dropConfetti, 800));
    }

    const rows = [1, 2, 3]
      .map((tier) => quiz.questions.filter((question) => question.tier === tier))
      .filter((questions) => questions.length > 0)
      .map((questions) => {
        const tierCorrect = questions.filter(isAnsweredCorrectly).length;
        const tierPercent = (tierCorrect / questions.length) * 100;
        // A live finish starts the bar empty, and the fill grows to `data-width` after layout.
        const fill = element('span', {
          class: 'score-bar-fill',
          'data-width': `${tierPercent}%`,
          style: `width: ${live ? 0 : tierPercent}%`,
        });
        return element('tr', { class: `band-${scoreBand(Math.round(tierPercent))}` }, [
          element('th', { scope: 'row' }, [tierLabel(questions[0].tier, questions[0].tierName)]),
          element('td', {}, [
            element('span', { class: 'score-cell' }, [
              element('span', { class: 'score-bar', 'aria-hidden': 'true' }, [fill]),
              element('span', {
                class: 'score-cell-count',
                text: `${tierCorrect} of ${questions.length}`,
              }),
            ]),
          ]),
        ]);
      });

    // The first sentence of the score line is the title of the summary, and the rest is the lede.
    const [scoreTitle, ...scoreRest] = scoreLine(percent).split(/(?<=\.) /);
    const summaryClass = `score-summary ${live ? 'is-rising' : ''}`.trim();
    const summary = element('div', { class: summaryClass }, [
      element('p', { class: 'score-title', text: scoreTitle }),
      scoreRest.length ? element('p', { class: 'lede', text: scoreRest.join(' ') }) : null,
    ]);

    showSlide([
      element('div', { class: 'score-hero' }, [heading, summary]),
      element('table', { class: 'score-table' }, [
        element('caption', { class: 'visually-hidden', text: 'Score by tier' }),
        element('tbody', {}, rows),
      ]),
      element('div', { class: 'actions' }, [
        missed.length ? button('Try the missed questions again', 'primary', retryMissed) : null,
        button('Restart', 'secondary', restart),
      ]),
    ]);
    if (live) {
      const fill = /** @type {SVGElement} */ (ring.querySelector('.ring-fill'));
      void fill.getBoundingClientRect(); // Forces a layout, so the fill starts from empty.
      fill.style.strokeDashoffset = String(fillOffset);
      for (const bar of slideElement.querySelectorAll('.score-bar-fill')) {
        /** @type {HTMLElement} */ (bar).style.width = bar.getAttribute('data-width');
      }
    }
  }

  /**
   * Draws the current slide, the bar, and the progress line.
   *
   * @param {boolean} moveFocus True to move the focus to the slide, for a new slide.
   */
  function render(moveFocus) {
    const slide = state.currentSlide;
    const answeredCount = Object.keys(state.answers).length;
    const onQuestion = slide >= 1 && slide <= questionCount;
    slideElement.classList.toggle('slide-question', onQuestion);
    // The cover shows the title as its heading, so the bar shows the title on the other slides.
    // The count leaves the bar when no question has an answer, so a fresh cover has no noise. A
    // question slide gives its number above the prompt, so the bar shows no count there.
    document.getElementById('bar-title').textContent = slide === 0 ? '' : quiz.title;
    const showCount = !onQuestion && answeredCount > 0;
    const count = showCount ? `${answeredCount} / ${questionCount} answered` : '';
    document.getElementById('bar-count').textContent = count;
    const fill = document.getElementById('progress-fill');
    const progress = onQuestion ? slide : answeredCount;
    fill.style.width = `${(progress / questionCount) * 100}%`;
    document.title = onQuestion ? `${slide}. ${quiz.title}` : quiz.title;

    if (slide === 0) renderTitleSlide();
    else if (slide === endSlide) renderEndSlide();
    else renderQuestionSlide(quiz.questions[slide - 1]);

    if (moveFocus) {
      slideElement.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }
  }

  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

  /**
   * Gives the theme on screen: the saved choice, or the system theme when no choice is saved.
   *
   * @returns {'light' | 'dark'} The theme.
   */
  function currentTheme() {
    const saved = storage.get(THEME_KEY);
    if (saved === 'light' || saved === 'dark') return saved;
    return darkQuery.matches ? 'dark' : 'light';
  }

  /**
   * Shows the icon of the other theme on the theme button: a sun in the dark theme, and a moon in
   * the light theme.
   */
  function updateThemeButton() {
    const other = currentTheme() === 'dark' ? 'light' : 'dark';
    const label = `Use ${other} theme`;
    themeToggle.replaceChildren(icon(other === 'light' ? 'sun' : 'moon'));
    themeToggle.setAttribute('aria-label', label);
    themeToggle.title = `${label} (T)`;
  }

  function toggleTheme() {
    const theme = currentTheme() === 'dark' ? 'light' : 'dark';
    storage.set(THEME_KEY, theme);
    document.documentElement.dataset.theme = theme;
    updateThemeButton();
  }

  // With no saved choice, the page leaves `data-theme` unset, so the CSS follows the system theme
  // when it changes.
  themeToggle.setAttribute('aria-keyshortcuts', 'T');
  themeToggle.addEventListener('click', toggleTheme);
  darkQuery.addEventListener('change', updateThemeButton);
  updateThemeButton();

  document.addEventListener('keydown', (event) => {
    if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
    const target = event.target;
    if (target instanceof HTMLElement) {
      if (target.isContentEditable || ['INPUT', 'SELECT', 'TEXTAREA'].includes(target.tagName)) {
        return;
      }
    }
    if (String(window.getSelection() || '').length > 0) return;

    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    const slide = state.currentSlide;
    if (slide >= 1 && slide <= questionCount && KEY_LETTERS[key]) {
      event.preventDefault();
      choose(KEY_LETTERS[key]);
    } else if (key === 't') {
      event.preventDefault();
      toggleTheme();
    } else if (key === 'ArrowRight' || key === 'Enter') {
      // Enter on a focused button or link activates that control, so do not also go on.
      if (key === 'Enter' && target instanceof HTMLElement && target.closest('button, a')) return;
      event.preventDefault();
      next();
    } else if (key === 'ArrowLeft') {
      event.preventDefault();
      back();
    }
  });

  window.addEventListener('hashchange', () => {
    const match = /^#(\d+)$/.exec(location.hash);
    if (match && Number(match[1]) !== state.currentSlide) goTo(Number(match[1]), { replace: true });
  });

  const hashMatch = /^#(\d+)$/.exec(location.hash);
  const startSlide = hashMatch ? Number(hashMatch[1]) : state.currentSlide;
  goTo(startSlide, { replace: true, focus: false });
})();
</script>
</body>
</html>
